[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koi-handler"
version = "0.10.10"
description = "Reverse shell listener"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
# Kept as an empty alias so `pipx install "koi-handler[mcp]"` still resolves for
# anyone with it in a script or doc; the deps now live in core.
mcp = []

[project.scripts]
koi = "koi.main:main"
koifuscator = "koi.main:obfuscator"
koireview = "koi.main:koireview"

[tool.setuptools.packages.find]
where = ["src"]
