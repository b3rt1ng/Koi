[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koi-handler"
version = "0.10.7"
description = "Reverse shell listener"
requires-python = ">=3.10"

[project.optional-dependencies]
# Koi's core stays dependency-free; MCP support is opt-in.
# mcp 2.x only: the server is built with the on_* callback API, which 1.x
# (decorator-based) does not accept.
mcp = ["mcp>=2.0", "uvicorn>=0.30", "starlette>=0.40"]

[project.scripts]
koi = "koi.main:main"
koifuscator = "koi.main:obfuscator"
koireview = "koi.main:koireview"

[tool.setuptools.packages.find]
where = ["src"]
